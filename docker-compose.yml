version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelstack-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelstack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelstack} -d ${POSTGRES_DB:-sentinelstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Hangfire dashboard runs as part of the API, not separate container

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: sentinelstack-network
